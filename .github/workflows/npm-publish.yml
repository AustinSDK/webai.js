name: Publish Package
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to fetch the OIDC token for npm
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://npmjs.org' # Tells npm to prepare the environment for registry interaction

      - run: npm ci
      
      # Publish without any token variables
      - run: npm publish --provenance --access public